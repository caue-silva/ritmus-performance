<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Sem conexão · Ritmus</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: #0b0b0b; color: #f5f5f4; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 22rem; display: grid; gap: 16px; justify-items: center; }
      img { width: 88px; height: 88px; border-radius: 50%; }
      h1 { margin: 0; font-size: 2rem; text-transform: uppercase; letter-spacing: .01em; font-weight: 800; }
      p { margin: 0; color: #a8a29e; line-height: 1.5; }
      button {
        min-height: 52px; padding: 0 24px; border: 0; border-radius: 12px; cursor: pointer;
        background: #f05b2a; color: #0b0b0b; font-size: 1rem; font-weight: 700;
      }
      button:focus-visible { outline: 3px solid #f5f5f4; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-ritmus.png" alt="Ritmus Performance" />
      <h1>Sem conexão</h1>
      <p>Parece que a internet caiu. Medições registradas sem sinal ficam guardadas no celular e são enviadas assim que a conexão voltar.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload())
    </script>
  </body>
</html>
